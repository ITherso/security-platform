# Termivar Platform CI. docs/CI.tr.md describes each job, why the backend job
# is red (the protected-surface gate tests and the absent HostBasedFirewall
# source), and what this workflow does not cover.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL 18, migrations, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway credential of a container that exists only during this
          # job. It is not a secret; the setup step below repeats it.
          POSTGRES_USER: sp_test_bootstrap
          POSTGRES_PASSWORD: ci-ephemeral-bootstrap-only
          POSTGRES_DB: postgres
          # As scripts/managed_postgres.py: UTF8, C locale, SCRAM for TCP logins.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --auth-host=scram-sha-256"
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready --username sp_test_bootstrap --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    defaults:
      run:
        working-directory: security-platform
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The tests read ../.tooling next to the checkout, as in the local workspace.
          path: security-platform
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the locked Python dependencies
        # requirements-lock.txt has no hashes yet, so --require-hashes is not
        # possible; docs/CI.tr.md says how to add them. --no-deps installs exactly
        # the pinned set and --only-binary refuses source builds.
        run: |
          python -m pip install --no-deps --only-binary=:all: -r requirements-lock.txt
          python -m pip check

      - name: Create the PostgreSQL roles, database and test configuration
        env:
          SP_CI_BOOTSTRAP_PASSWORD: ci-ephemeral-bootstrap-only
        run: python scripts/ci/ci_database.py setup --config ../.tooling/platform-test-env.json --port 5432

      - name: Migrations (upgrade head, downgrade base, upgrade head)
        run: python scripts/ci/ci_database.py migrations --config ../.tooling/platform-test-env.json

      - name: Runtime role grants
        run: python scripts/ci/ci_database.py grant --config ../.tooling/platform-test-env.json

      - name: Full pytest suite (unit, PostgreSQL integration, API and tenant isolation, e2e)
        id: pytest
        # Expected red: 8 gate tests fail on purpose until the owner approves the
        # protected-surface re-cut, and the policy_revision_lab tests that need the
        # HostBasedFirewall source error without it. Nothing is deselected, skipped
        # or allowed to fail here. SP_HBF_SOURCE stays unset: that source is not in
        # this repository.
        run: |
          export PYTHONPATH="$PWD/src"
          python -m pytest -p no:cacheprovider -q -rfEs --junitxml="$RUNNER_TEMP/pytest-junit.xml"

      - name: JUnit summary; the PostgreSQL tests must not be skipped
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: python scripts/ci/junit_summary.py "$RUNNER_TEMP/pytest-junit.xml" --no-skips-in tests.integration --no-skips-in tests.e2e

      - name: Upload the JUnit report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: ${{ runner.temp }}/pytest-junit.xml
          if-no-files-found: error
          retention-days: 30

  console:
    name: Operator console (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: operator-console
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.22.1
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up Python 3.14 (the build script runs build.py after vite build)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the locked console dependencies (pnpm from packageManager, through corepack)
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript typecheck
        run: corepack pnpm run typecheck

      - name: Console tests (tests/run.mjs; node:test through the installed Vite)
        run: corepack pnpm run test

      - name: Production build
        run: corepack pnpm run build

  dependency-audit:
    name: Dependency audit (pip-audit, pnpm audit --prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js 24.22.1
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: pip-audit over the Python lock files
        # Its own virtual environment keeps the audit tool out of the project's
        # dependency set. --no-deps with --disable-pip audits exactly the pins.
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --strict --disable-pip --no-deps -r requirements-lock.txt -r requirements-build-lock.txt

      - name: pnpm audit of the console's production dependencies
        if: ${{ !cancelled() }}
        working-directory: operator-console
        run: corepack pnpm audit --prod
